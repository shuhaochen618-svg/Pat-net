name: Repository, Math & Data Integrity CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers numpy pandas pyarrow pyyaml scipy scikit-learn jieba lightgbm matplotlib

      - name: Syntax check all source and script files
        run: python -m compileall -q src scripts

      - name: Run repository integrity, split isolation, and hygiene verification
        run: python scripts/verify_reproduction.py

      - name: Run core mathematical, loss, and conformal risk unit tests
        run: python scripts/test_core.py

      - name: Run synthetic end-to-end forward/backward checks
        run: python scripts/test_pipelines_synthetic.py
